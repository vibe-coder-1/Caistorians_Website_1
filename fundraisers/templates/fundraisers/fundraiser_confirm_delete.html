{% extends "Main/base.html" %}

{% block content %}
<div style="max-width: 700px; margin: 60px auto; background: #ffffff; padding: 40px; border-radius: 15px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); font-family: 'Segoe UI', sans-serif;">
  <h2 style="color: #002147; font-size: 30px; margin-bottom: 20px;">Delete Fundraiser</h2>
  <p style="font-size: 17px; color: #555; margin-bottom: 30px;">Are you sure you want to delete "{{ fundraiser.title }}"?</p>

  <div style="display:flex; gap: 12px; justify-content: flex-start; align-items: center;">
    <form method="post" style="margin: 0;">
      {% csrf_token %}
      <button type="submit" style="background-color: #cc0000; color: white; border: none; padding: 12px 20px; border-radius: 8px; font-size: 15px; cursor: pointer;">
        Yes, delete
      </button>
    </form>

    <a href="{% url 'fundraisers:fundraiser_detail' fundraiser.id %}"
       style="background-color: #004080; color: white; text-decoration: none; padding: 12px 20px; border-radius: 8px; font-size: 15px;">
      Cancel
    </a>
  </div>
</div>
{% endblock %}
